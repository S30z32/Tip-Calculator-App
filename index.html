<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <section id="containerUno">  
        <h1>Tip Calculator</h1> 
        <h2>Split the bill with your friends.</h2>
        <section>   
            <h2>Bill Amount $</h2>
            <input id="billAmount" type="text" placeholder='$0.00' >
        </section>
        <section id='secondSection'>
            <section class='deux'>
                <h2>Tip (%)</h2>
                <input id="tipAmount" type="text" placeholder='20%' >
            </section>
            <section class='deux'>
                <h2>People</h2>
                <input id="peopleAmount" type="text" placeholder='2' >
            </section>
            
        </section>
        <button id='calcBttn'  class="favButton styled" type="button">Calculate</button>
            <hr />
        <section id="sacResults">   
            <section class="sectionResults">
                <h2>Tip Amount</h2>
                <span id="tipTotal">$0.00</span>
            </section>
            <section class="sectionResults">
                <h2>Bill Amount</h2>
                <span id="billAm">$0.00</span>
            </section>
        </section>
        <section id="resultSec">
            <h2>Each Person Pays</h2>
            <h2 id="totalResult">$</h2>

        </section>

    </section>

</body>
</html>
