<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <section id="containerUno">  
        <h1 class="headerSpecs">Tip Calculator</h1> 
        <h2 class="fontSizeCalc headerSpecs">Split the bill with your friends.</h2>
        <section id="billSection">   
            <h2 class="fontSizeCalc">Bill Amount ($)</h2>
            <input id="billAmount" type="text" class="fillerV" placeholder='$0.00' >
        </section>
        <section id='secondSection'>
            <section class='deux'>
                <h2 class="fontSizeCalc">Tip (%)</h2>
                <input id="tipAmount" class="fillerV" type="text" placeholder='20%' >
            </section>
            <section class='deux'>
                <h2 class="fontSizeCalc">People</h2>
                <input id="peopleAmount" class="fillerV" type="text" placeholder='2' >
            </section>
            
        </section>
        <button id='calcBttn'  class="favButton styled" type="button">Calculate</button>
            <hr />
        <section id="sacResults">   
            <section class="sectionResults">
                <h2 class="fontSizeCalc">Tip Amount</h2>
                <span id="tipTotal">$0.00</span>
            </section>
            <section class="sectionResults">
                <h2 class="fontSizeCalc">Bill Amount</h2>
                <span id="billAm">$0.00</span>
            </section>
        </section>
        <section id="resultSec" >
            <h2 class="fontSizeCalc">Each Person Pays</h2>
            <h2 id="totalResult" class="">$</h2>

        </section>

    </section>

</body>
</html>
