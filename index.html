<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <section>  
        <h1>Tip Calculator</h1> 
        <h2>Split the bill with your friends.</h2>
        <section>   
            <h2>Bill Amount $</h2>
            <div id='billAmount'>$0.00</div>
        </section>
        <section id='secondSection'>
            <section class='deux'>
                <h2>Tip %</h2>
                <input id="tipAmount" type="text" placeholder='20%' >
            </section>
            <section class='deux'>
                <h2>People</h2>
                <input id="peopleAmount" type="text" placeholder='2' >
            </section>
            <button class="favorite styled" type="button">Calculate</button>

    

        </section>


    </section>

</body>
</html>
